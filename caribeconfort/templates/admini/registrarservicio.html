{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Servicio</title>
    <link rel="stylesheet" href="{% static 'css/barra-encabezado.css' %}?v=107">
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/administrador/modulos.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin-panel-shell.css' %}?v=12">
</head>
<body>
    {% include 'inc/admin_header.html' %}
    {% include 'inc/admin_nav.html' %}

    <main class="ad-main adm-page">
    <header class="adm-heading">
        <div><p class="adm-eyebrow">CATÁLOGO DEL HOTEL</p><h1>Registrar servicio</h1><p>Agrega un servicio y configura su información y tarifa.</p></div>
    </header>
    <section class="adm-card">
    <form action="" method="POST" enctype="multipart/form-data" autocomplete="off" class="adm-form adm-form-grid">
        {% csrf_token %}

        <div class="adm-field">
            <label>Nombre</label>
            <input type="text" name="txtNombre" required>
        </div>

        <div class="adm-field">
            <label>Descripción</label>
            <input type="text" name="txtDescripcion">
        </div>

        <div class="adm-field">
            <label>Precio</label>
            <input type="number" step="0.01" name="txtPrecio" required>
        </div>

        <div class="adm-field">
            <label>Imagen</label>
            <input type="file" name="txtImg" accept="image/*">
        </div>

        <div class="adm-form-actions"><button type="submit" class="adm-button">Guardar servicio</button></div>
    </form>
    </section>
    </main>
    <script src="{% static 'js/barra-encabezado.js' %}?v=15"></script>
</body>
</html>
