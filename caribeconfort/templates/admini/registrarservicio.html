{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Servicio</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin-panel-shell.css' %}?v=2">
</head>
<body>
    <h1>Registrar servicio</h1>

    <form action="" method="POST" enctype="multipart/form-data" autocomplete="off">
        {% csrf_token %}

        <div class="col-md-4">
            <label>Nombre</label>
            <input type="text" name="txtNombre" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label>Descripción</label>
            <input type="text" name="txtDescripcion" class="form-control">
        </div>

        <div class="col-md-4">
            <label>Precio</label>
            <input type="number" step="0.01" name="txtPrecio" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label>Imagen</label>
            <input type="file" name="txtImg" class="form-control" accept="image/*">
        </div>

        <button type="submit" class="btn btn-registrar2">Guardar</button>
    </form>
</body>
</html>
