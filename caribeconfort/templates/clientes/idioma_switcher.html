{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<form class="language-switcher" method="post" action="{% url 'set_language' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="language-switcher-button{% if CURRENT_LANGUAGE == 'es' %} is-active{% endif %}" type="submit" name="language" value="es" aria-label="{% trans 'Cambiar a español' %}">ES</button>
    <span class="language-switcher-separator" aria-hidden="true">|</span>
    <button class="language-switcher-button{% if CURRENT_LANGUAGE == 'en' %} is-active{% endif %}" type="submit" name="language" value="en" aria-label="{% trans 'Switch to English' %}">EN</button>
</form>
